name: CI/CD - Node App to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:          # lets you run it manually from the Actions tab

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/node-cicd-app

# If two pushes happen quickly, don't run two deployments at once
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ───────────── JOB 1: BUILD NODE APP + TEST ─────────────
  test:
    name: Build & Test Node App
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Node app
        run: npm run build --if-present

      - name: Run tests
        run: npm test

  # ───────────── JOB 2: BUILD DOCKER IMAGE + PUSH ─────────────
  docker:
    name: Build & Push Docker Image
    needs: test                      # runs only if tests passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ───────────── JOB 3: DEPLOY TO EC2 ─────────────
  deploy:
    name: Deploy to EC2
    needs: docker                    # runs only if image was pushed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true          # stop immediately if any command fails
          script: |
            set -e
            echo "Pulling new image..."
            docker pull ${{ env.IMAGE_NAME }}:latest

            echo "Stopping old container (if any)..."
            docker stop node-app || true
            docker rm node-app || true

            echo "Starting new container..."
            docker run -d --name node-app --restart unless-stopped \
              -p 80:3000 ${{ env.IMAGE_NAME }}:latest

            echo "Health check..."
            sleep 5
            if ! curl -f http://localhost:80/health; then
              echo "Health check FAILED. Container logs:"
              docker logs node-app
              exit 1
            fi

            docker image prune -f

      - name: Deployment succeeded
        if: success()
        run: echo "✅ Deployed to http://${{ secrets.EC2_HOST }}"

      - name: Deployment failed
        if: failure()
        run: echo "❌ Deployment failed. Check the logs above."